
name: Build bilingual Bible verses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and validate bilingual verses
        run: python tools/build_bilingual_verses.py

      - name: Commit generated bilingual data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-verses.json
          git diff --cached --quiet || git commit -m "Build bilingual daily Bible verses"
          git push

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-build-errors
          path: data/bilingual-build-errors.txt
          if-no-files-found: ignore

