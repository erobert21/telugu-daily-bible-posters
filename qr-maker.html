<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 Monthly QR Generator</title>
<style>body{font-family:Arial,sans-serif;background:#f3f4f8;margin:20px;color:#171b46}main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:18px}input{width:100%;padding:12px;border:1px solid #ccd;border-radius:8px;font-size:16px;margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:12px;padding:14px;text-align:center}.card img{width:160px;height:160px;margin:10px auto;display:block}button{background:#171b46;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}.hint{line-height:1.6;color:#555}</style></head>
<body><main><h1>12 Monthly Bible Poster QR Codes</h1><p class="hint">After hosting the website, paste its final HTTPS URL below. Each monthly QR opens that month's daily poster and selects the current day number.</p>
<label><b>Published website URL</b></label><input id="base" placeholder="https://yourname.github.io/telugu-daily-bible-posters/">
<button id="make">Generate monthly QR codes</button><div class="grid" id="grid"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const names=["January","February","March","April","May","June","July","August","September","October","November","December"];
document.getElementById("make").onclick=()=>{let b=document.getElementById("base").value.trim();if(!/^https:\/\/.+/.test(b)){alert("Please enter your published HTTPS website URL.");return;}b=b.endsWith("/")?b:b+"/";const grid=document.getElementById("grid");grid.innerHTML="";
names.forEach((n,i)=>{const card=document.createElement("div");card.className="card";const title=document.createElement("b");title.textContent=n;card.appendChild(title);const holder=document.createElement("div");card.appendChild(holder);const target=b+"?month="+(i+1);new QRCode(holder,{text:target,width:200,height:200,correctLevel:QRCode.CorrectLevel.H});const p=document.createElement("p");p.textContent=target;p.style="font-size:11px;word-break:break-all";card.appendChild(p);const btn=document.createElement("button");btn.textContent="Download "+n;btn.onclick=()=>{const img=holder.querySelector("img");const canvas=holder.querySelector("canvas");const a=document.createElement("a");a.href=canvas?canvas.toDataURL("image/png"):img.src;a.download=n+"_Monthly_Bible_Poster_QR.png";a.click();};card.appendChild(btn);grid.appendChild(card);});};
</script></body></html>
